<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Provo — Media Verification</title>

    <style>
        body {
            background: #10151f;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 60px 20px;
        }

        .upload-box {
            max-width: 500px;
            margin: auto;
            padding: 35px;
            border: 1px solid #53657e;
            border-radius: 12px;
        }

        button {
            background: #b5ff61;
            color: #10151f;
            padding: 12px 25px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 20px;
        }

        #result {
            margin-top: 25px;
            overflow-wrap: anywhere;
            text-align: left;
            line-height: 1.7;
        }
    </style>
</head>

<body>

    <h1>PROVO</h1>
    <p>Digital Media Provenance Verification</p>

    <div class="upload-box">

        <h2>Upload Media</h2>

        <form id="uploadForm">

            <input
                type="file"
                id="mediaFile"
                accept=".jpg,.jpeg,.png,.webp,.mp4,.mov"
                required
            >

            <br>

            <button type="submit" id="uploadButton">
                Analyze Media
            </button>

        </form>

        <div id="result" aria-live="polite"></div>

    </div>

    <script>
        const form = document.getElementById("uploadForm");
        const fileInput = document.getElementById("mediaFile");
        const result = document.getElementById("result");
        const button = document.getElementById("uploadButton");

        form.addEventListener("submit", async (event) => {
            event.preventDefault();

            const file = fileInput.files[0];
            if (!file) return;

            const formData = new FormData();
            formData.append("file", file);

            button.disabled = true;
            result.textContent = "Uploading your media...";

            try {
                const response = await fetch("/api/upload", {
                    method: "POST",
                    body: formData
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(
                        data.detail || "Upload failed"
                    );
                }

                result.replaceChildren();

                const heading = document.createElement("h3");
                heading.textContent = "Upload successful";

                const filename = document.createElement("p");
                filename.textContent =
                    "Filename: " + data.filename;

                const size = document.createElement("p");
                size.textContent =
                    "Size: " +
                    (data.file_size / 1024 / 1024).toFixed(2) +
                    " MB";

                const hash = document.createElement("p");
                hash.textContent =
                    "SHA-256: " + data.sha256;

                const status = document.createElement("p");
                status.textContent =
                    "Verification: Not checked yet";

                result.append(
                    heading, filename, size, hash, status
                );

            } catch (error) {
                result.textContent = error.message;

            } finally {
                button.disabled = false;
            }
        });
    </script>

</body>
</html>
